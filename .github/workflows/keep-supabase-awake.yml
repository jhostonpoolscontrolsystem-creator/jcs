name: Keep Supabase Awake (Anti-Pause Pulse)

on:
  schedule:
    # Executa a cada 3 dias às 06:00 UTC (03:00 Horário de Brasília)
    # Impede que o Supabase atinja a janela de 7 dias de inatividade gratuita
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite disparo manual via painel Actions do GitHub a qualquer momento

jobs:
  ping-supabase:
    name: Ping Database & Application Keep-Alive
    runs-on: ubuntu-latest

    steps:
      - name: Send Keep-Alive Pulse to Application & Database
        run: |
          echo "🚀 Disparando pulso de atividade para o endpoint da aplicação..."
          RESPONSE=$(curl -s -m 25 -w "\nHTTP_STATUS:%{http_code}" https://jhpcs.vercel.app/api/cron/keep-alive || curl -s -m 25 -w "\nHTTP_STATUS:%{http_code}" https://jcs-pools.vercel.app/api/cron/keep-alive)
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Body: $BODY"
          echo "HTTP Status Code: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Banco de dados PostgreSQL (Supabase) e aplicação acordados com sucesso!"
          else
            echo "⚠️ Aviso: Endpoint retornou HTTP $STATUS."
          fi
